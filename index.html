<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare Quill Collection</title>
    <!-- Pixel Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="pixel-border">
        <h1>FLARE QUILL ARCHIVES</h1>
        <p class="subtitle">SPECIES DATABASE & BATTLE STATS</p>
    </header>

    <div class="controls pixel-border">
        <input type="text" id="searchInput" placeholder="SEARCH SPECIES..." class="pixel-input">

        <select id="tribeSelect" class="pixel-input" style="width: 200px; cursor: pointer;">
            <option value="all">FILTER: ALL TRIBES</option>
            <!-- Populated by JS -->
        </select>

        <select id="sortSelect" class="pixel-input" style="width: 200px; cursor: pointer;">
            <option value="default">SORT: THEMATIC</option>
            <option value="name">SORT: NAME (A-Z)</option>
            <option value="cost_asc">SORT: COST (LOW-HIGH)</option>
            <option value="cost_desc">SORT: COST (HIGH-LOW)</option>
        </select>
        <div class="stats-counter" id="statsCounter">DISCOVERED: 0/62</div>
    </div>

    <!-- Interactive World Map Section (9 Regions) -->
    <!-- Interactive World Map Section (Grid) -->
    <div class="pixel-border" style="margin-bottom: 30px; text-align: center;">
        <h2 style="color: var(--highlight); margin-bottom: 15px; font-size: 1.2rem;">WORLD MAP (SELECT TRIBE)</h2>

        <div class="map-container" style="position: relative; max-width: 600px; margin: 0 auto;">
            <img src="world_map.png" alt="World Map" style="width: 100%; display: block; image-rendering: pixelated;">

            <div class="grid-overlay" style="
                position: absolute; 
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%; 
                display: grid; 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(4, 1fr);
                cursor: pointer;">

                <!-- Row 1 -->
                <div onclick="filterByTribe('Crystalline Guard')" title="Phaselite Caverns"></div>
                <div onclick="filterByTribe('Culinary Corps')" title="Gourmet Galley"></div>
                <div onclick="filterByTribe('Highborn Court')" title="Gilded Spire"></div>

                <!-- Row 2 -->
                <div onclick="filterByTribe('Inferno Legion')" title="Volcanic Wastes"></div>
                <div onclick="filterByTribe('Iron Legion')" title="Ironworks"></div>
                <div onclick="filterByTribe('Mystic Enclave')" title="Arcane Sanctum"></div>

                <!-- Row 3 -->
                <div onclick="filterByTribe('Shadow Cabal')" title="Venomous Swamplands"></div>
                <div onclick="filterByTribe('Storm Vanguard')" title="Thunder Peaks"></div>
                <div onclick="filterByTribe('Tideborn Covenant')" title="Frozen Fjords"></div>

                <!-- Row 4 -->
                <div onclick="filterByTribe('Verdant Circle')" title="Emerald Grove"></div>
                <div onclick="filterByTribe('Void Gastronomes')" title="Crimson Coast"></div>
                <div style="cursor: default;" title="Unexplored"></div>
            </div>
        </div>
        <p style="color: #666; font-size: 0.8rem; margin-top: 10px;">*Tap a zone to filter*</p>
    </div>

    <main id="cardGrid" class="card-grid">
        <!-- Cards will be injected here by script.js -->
    </main>

    <!-- Modal for Detailed View -->
    <div id="modal" class="modal hidden">
        <div class="modal-content pixel-border">
            <span class="close-btn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
